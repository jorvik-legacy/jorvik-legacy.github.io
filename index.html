<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Jorvik Legacy</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #fff0f5; 
            margin: 0;
            padding: 20px;
        }

        .fo-cim {
            margin: 40px 0;
            font-size: 36px;
            font-weight: bold;
            color: #d81b60;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .kontener {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .menu-kartya {
            display: flex;
            width: 80%;
            max-width: 600px;
            height: 150px;
            background-color: #ff69b4;
            border: 4px solid #c71585;
            border-radius: 20px;
            overflow: hidden;
            text-decoration: none;
            color: white;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .menu-kartya:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        .szoveg-resz {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .kep-resz {
            width: 40%; /* A jobb oldal 40%-a lesz a kép */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-left: 4px solid #c71585;
        }

        .hirek-kep { background-image: url('hirek.png'); 
            background-position: center; }
        .segitseg-kep { background-image: url('segitseg.png'); 
            background-position: center; 
            background-size: contain;
            background-repeat: no-repeat;}
        .media-kep { background-image: url('media.png');    
            background-position: center;}
        
    </style>
</head>
<body>

    <div class="fo-cim">OLDAL NEVE</div>

    <div class="kontener">
        <a href="hirek.html" class="menu-kartya">
            <div class="szoveg-resz">HÍREK</div>
            <div class="kep-resz hirek-kep"></div>
        </a>

        <a href="segitseg.html" class="menu-kartya">
            <div class="szoveg-resz">SEGÍTSÉG</div>
            <div class="kep-resz segitseg-kep"></div>
        </a>

        <a href="media.html" class="menu-kartya">
            <div class="szoveg-resz">MÉDIA</div>
            <div class="kep-resz media-kep"></div>
        </a>
    </div>

</body>
</html>
